name: CD — Build · Infra · Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to Docker Hub'
        type: boolean
        default: true

# Read-only by default; each job is granted only what it needs.
permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Secret scan ────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Checksum-pinned: a tampered release asset fails here, not in the scan.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --redact --log-level warn

  # ── 2. SAST ───────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Semgrep
        run: |
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            semgrep ci --sarif --output=semgrep.sarif
          else
            semgrep scan --config=auto --sarif --output=semgrep.sarif
          fi
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── 3. Dependency audit — stricter in prod ────────────────────────
  # Gates on HIGH, but only for dependencies that ship: the web image is
  # static files served by nginx, so its devDependencies (Vite, Tailwind)
  # never reach production. CI still audits everything at CRITICAL.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Audit backend
        run: cd app/backend && npm ci && npm audit --omit=dev --audit-level=high

      - name: Audit web
        run: cd app/web && npm ci && npm audit --omit=dev --audit-level=high

  # ── 4. Build · push · scan · sign per service ────────────────────
  build-push:
    name: Build · Push · Sign (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [secret-scan, sast, audit]
    permissions:
      contents: read
      security-events: write   # Trivy SARIF upload
      id-token: write          # keyless Cosign signing
    strategy:
      fail-fast: false
      matrix:
        service: [backend, web]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/skybroe-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=SkyBroe ${{ matrix.service }}
            org.opencontainers.image.description=Aviation tools for GA pilots
            org.opencontainers.image.vendor=SkyBroe
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./app/${{ matrix.service }}
          file: ./app/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}-prod
          cache-to: type=gha,scope=${{ matrix.service }}-prod,mode=max
          # Web only (ignored by the backend Dockerfile). RUM stays disabled
          # until the repo variables are set from `terraform output`.
          build-args: |
            VITE_RUM_APP_ID=${{ vars.VITE_RUM_APP_ID }}
            VITE_RUM_IDENTITY_POOL_ID=${{ vars.VITE_RUM_IDENTITY_POOL_ID }}
            VITE_AWS_REGION=${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Trivy image scan
        id: trivy-image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/skybroe-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-image-${{ matrix.service }}.sarif

      - name: Ensure image SARIF valid
        if: always()
        run: |
          FILE="trivy-image-${{ matrix.service }}.sarif"
          jq -e '.runs | length > 0' "$FILE" > /dev/null 2>&1 || \
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","version":"0.0.0","informationUri":"https://github.com/aquasecurity/trivy","rules":[]}},"results":[]}]}' > "$FILE"

      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Warn on scan findings
        if: steps.trivy-image.outcome == 'failure'
        run: echo "::warning::Trivy found vulnerabilities in skybroe-${{ matrix.service }}. Review Security → Code scanning."

      # Release gate: a CRITICAL CVE that already has a fix blocks the deploy.
      # Production runs the immutable sha-<commit> tag (see the deploy job),
      # so a blocked image never reaches EC2 even though it was pushed.
      # Accept a specific CVE only via .trivyignore, with a reason.
      - name: Gate on fixable CRITICAL CVEs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/skybroe-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign and verify image (keyless OIDC)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/skybroe-${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com > /dev/null
          echo "Signature verified for $IMAGE"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        continue-on-error: true
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/skybroe-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}-${{ github.sha }}.spdx.json
          upload-artifact: true
          upload-release-assets: true

  # ── 5. Infra apply — provision / update EC2 ──────────────────────
  infra-apply:
    name: Infra Apply (Terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-push]
    defaults:
      run:
        working-directory: infra/terraform
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_key_name: keyit
      TF_VAR_domain_name: ${{ secrets.APP_DOMAIN }}
      TF_VAR_hosted_zone_id: ${{ secrets.HOSTED_ZONE_ID }}
      TF_VAR_app_eip: ${{ secrets.EC2_HOST }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.8.5'

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=ec2/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMO_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Clear blackhole default route
        run: |
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query "Vpcs[0].VpcId" --output text --region "$REGION")
          RTB_ID=$(aws ec2 describe-route-tables \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=association.main,Values=true" \
            --query "RouteTables[0].RouteTableId" --output text --region "$REGION")
          aws ec2 delete-route --route-table-id "$RTB_ID" \
            --destination-cidr-block 0.0.0.0/0 --region "$REGION" \
            && echo "Stale route removed" || echo "No conflicting route"

      - name: Import existing AWS resources into state
        # The cleanup workflow destroys only the cost-incurring EC2 instance;
        # everything tagged do_not_delete=true (networking, IAM, and the whole
        # observability stack) survives. If the Terraform state was also
        # wiped, those survivors must be re-imported here before apply,
        # otherwise apply tries to *create* resources that already exist and
        # fails with AlreadyExists. Keep this list in sync with the protected
        # resources in main.tf / monitoring.tf.
        run: |
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          tf_import_if_missing() {
            local resource=$1 id=$2
            if terraform state show "$resource" > /dev/null 2>&1; then
              echo "$resource already in state — skipping import"
            else
              terraform import "$resource" "$id" \
                || echo "Import of $resource failed — may not exist yet"
            fi
          }

          # ── IAM — EC2 role (inline policies + managed attachments) ───
          tf_import_if_missing aws_iam_role.skybroe_ec2 skybroe-ec2-role
          tf_import_if_missing aws_iam_instance_profile.skybroe_ec2 skybroe-ec2-profile
          tf_import_if_missing aws_iam_role_policy.ssm_read skybroe-ec2-role:skybroe-ssm-read
          tf_import_if_missing aws_iam_role_policy.ses_send skybroe-ec2-role:skybroe-ses-send
          tf_import_if_missing aws_iam_role_policy_attachment.cw_agent \
            "skybroe-ec2-role/arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy"
          tf_import_if_missing aws_iam_role_policy_attachment.xray \
            "skybroe-ec2-role/arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess"
          tf_import_if_missing aws_iam_role_policy_attachment.ssm_core \
            "skybroe-ec2-role/arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"

          # ── IAM — RUM unauthenticated guest role ────────────────────
          tf_import_if_missing aws_iam_role.rum_unauth skybroe-rum-unauth
          tf_import_if_missing aws_iam_role_policy.rum_unauth \
            skybroe-rum-unauth:skybroe-rum-unauth-policy

          # ── Security group (protected, survives) ────────────────────
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=skybroe-sg" \
            --query "SecurityGroups[0].GroupId" --output text --region "$REGION" 2>/dev/null || true)
          [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ] && \
            tf_import_if_missing aws_security_group.skybroe "$SG_ID"

          # ── EC2 instance (skybroe-app) ───────────────────────────────
          APP_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=skybroe-app" \
                      "Name=instance-state-name,Values=running,stopped" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text --region "$REGION" 2>/dev/null || true)
          [ -n "$APP_INSTANCE_ID" ] && [ "$APP_INSTANCE_ID" != "None" ] && \
            tf_import_if_missing aws_instance.skybroe "$APP_INSTANCE_ID"

          # ── EIP association ─────────────────────────────────────────
          APP_ASSOC_ID=$(aws ec2 describe-addresses \
            --filters "Name=public-ip,Values=$TF_VAR_app_eip" \
            --query "Addresses[0].AssociationId" --output text --region "$REGION" 2>/dev/null || true)
          [ -n "$APP_ASSOC_ID" ] && [ "$APP_ASSOC_ID" != "None" ] && \
            tf_import_if_missing aws_eip_association.skybroe "$APP_ASSOC_ID"

          # ── Remove legacy managed EIP from state (now a data source) ─
          # Historical entry predates the skybroe rename, so target the old
          # address to purge any stale state.
          if terraform state show aws_eip.skyops > /dev/null 2>&1; then
            terraform state rm aws_eip.skyops
            echo "Removed legacy aws_eip.skyops from state"
          fi

          # ── Internet gateway — now an unmanaged data source ─────────
          # The default VPC's IGW is referenced via data source, not created.
          # Drop any previously-imported (and possibly tainted/detached)
          # legacy managed entry so Terraform stops trying to replace it.
          if terraform state show aws_internet_gateway.skyops > /dev/null 2>&1; then
            terraform state rm aws_internet_gateway.skyops
            echo "Removed legacy aws_internet_gateway.skyops from state (now a data source)"
          fi

          # ── Observability — SNS / logs / SSM ────────────────────────
          tf_import_if_missing aws_sns_topic.alerts "arn:aws:sns:${REGION}:${ACCOUNT_ID}:skybroe-alerts"
          tf_import_if_missing aws_cloudwatch_log_group.app /skybroe/app
          tf_import_if_missing aws_cloudwatch_log_group.system /skybroe/system
          tf_import_if_missing aws_ssm_parameter.cw_agent_config /skybroe/cloudwatch-agent-config

          # ── Observability — RUM + Cognito guest access ──────────────
          tf_import_if_missing aws_rum_app_monitor.skybroe skybroe-web

          POOL_ID=$(aws cognito-identity list-identity-pools --max-results 60 \
            --query "IdentityPools[?IdentityPoolName=='skybroe_rum'].IdentityPoolId | [0]" \
            --output text --region "$REGION" 2>/dev/null || true)
          if [ -n "$POOL_ID" ] && [ "$POOL_ID" != "None" ]; then
            tf_import_if_missing aws_cognito_identity_pool.rum "$POOL_ID"
            tf_import_if_missing aws_cognito_identity_pool_roles_attachment.rum "$POOL_ID"
          fi

          # ── Observability — CloudWatch alarms + dashboard ───────────
          tf_import_if_missing aws_cloudwatch_metric_alarm.cpu_high      skybroe-cpu-high
          tf_import_if_missing aws_cloudwatch_metric_alarm.memory_high   skybroe-memory-high
          tf_import_if_missing aws_cloudwatch_metric_alarm.disk_high     skybroe-disk-high
          tf_import_if_missing aws_cloudwatch_metric_alarm.status_check  skybroe-status-check-failed
          tf_import_if_missing aws_cloudwatch_dashboard.skybroe SkyBroe-Overview

          # ── SES — domain identity for transactional email ──────────
          tf_import_if_missing aws_sesv2_email_identity.domain "$TF_VAR_domain_name"

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false -lock-timeout=5m

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=5m tfplan

      - name: Wait for EC2 instance to pass status checks
        run: |
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=skybroe-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text --region "$REGION")
          echo "Waiting for instance $INSTANCE_ID to pass status checks..."
          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID" --region "$REGION"
          echo "Instance is ready"

      - name: Terraform Outputs
        id: tf-outputs
        run: terraform output

  # ── 6. Deploy — write .env + restart containers ──────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [infra-apply]

    steps:
      - name: Validate required secrets
        # Fail fast with a clear message if a required secret is missing. Without
        # this, an empty JWT_SECRET (or DB creds) is written to .env and the
        # backend crash-loops at boot — surfacing only as a confusing 5-minute
        # smoke-test timeout much later in the pipeline.
        env:
          JWT_SECRET:         ${{ secrets.JWT_SECRET }}
          DB_USER:            ${{ secrets.DB_USER }}
          DB_PASSWORD:        ${{ secrets.DB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          EC2_HOST:           ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY:        ${{ secrets.EC2_SSH_KEY }}
          APP_DOMAIN:         ${{ secrets.APP_DOMAIN }}
        run: |
          missing=0
          for name in JWT_SECRET DB_USER DB_PASSWORD DOCKERHUB_USERNAME EC2_HOST EC2_SSH_KEY APP_DOMAIN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret '${name}' is not set — configure it in repo Settings → Secrets and variables → Actions"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required secrets are present."

      # Deploy the immutable per-commit tag that build-push scanned and signed,
      # not :latest, so production runs exactly what passed the gates and a
      # rollback has a concrete tag to return to. A no-push manual run has no
      # new images, so it redeploys :latest.
      - name: Resolve image tag
        id: image
        env:
          PUSHED: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        run: |
          if [ "$PUSHED" = "true" ]; then tag="sha-${GITHUB_SHA::7}"; else tag=latest; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: $tag"

      - name: Wait for SSH to be ready
        run: |
          for i in $(seq 1 24); do
            nc -z -w5 "${{ secrets.EC2_HOST }}" 22 && echo "SSH ready after $((i * 10))s" && exit 0
            echo "Attempt $i/24: port 22 not yet open, retrying in 10s..."
            sleep 10
          done
          echo "::error::EC2 SSH port 22 never became reachable after 4 minutes"
          exit 1

      # Ship the stack definition straight from the repo — the compose file
      # and Caddyfile in infra/ are the single source of truth for EC2.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: infra

      - name: Copy compose file + Caddyfile to EC2
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          # Optional host-key pin (SHA256:… from `ssh-keygen -lf`); unset = not checked.
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          source: infra/docker-compose.prod.yml,infra/Caddyfile
          target: /tmp/skybroe-deploy
          strip_components: 1

      - name: Write .env and restart containers
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 15m
          envs: DOCKERHUB_USERNAME,DB_USER,DB_PASSWORD,JWT_SECRET,FAA_CLIENT_ID,FAA_CLIENT_SECRET,ANTHROPIC_API_KEY,AWS_REGION,APP_DOMAIN,APP_URL,SES_FROM_EMAIL,IMAGE_TAG
          script: |
            set -e
            # Install Docker + Compose plugin if not already present
            # (normally done by user_data; this covers an older instance).
            if ! command -v docker &>/dev/null; then
              sudo dnf install -y docker
              sudo systemctl enable --now docker
            fi
            if ! sudo docker compose version &>/dev/null 2>&1; then
              curl -fsSL -o /tmp/docker-compose \
                "https://github.com/docker/compose/releases/download/v2.27.1/docker-compose-linux-$(uname -m)"
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo install -m 0755 /tmp/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
            fi
            sudo mkdir -p /opt/skybroe
            sudo install -m 0644 /tmp/skybroe-deploy/docker-compose.prod.yml /tmp/skybroe-deploy/Caddyfile /opt/skybroe/
            rm -rf /tmp/skybroe-deploy
            cd /opt/skybroe
            # Remember what is running now, so a failed release can roll back.
            PREV_TAG=$(sudo sed -n 's/^IMAGE_TAG=//p' .env 2>/dev/null || true)
            PREV_TAG=${PREV_TAG:-latest}
            echo "Current tag: ${PREV_TAG} → new tag: ${IMAGE_TAG}"
            sudo tee /opt/skybroe/.env > /dev/null <<EOF
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            FAA_CLIENT_ID=${FAA_CLIENT_ID}
            FAA_CLIENT_SECRET=${FAA_CLIENT_SECRET}
            ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
            AWS_REGION=${AWS_REGION}
            APP_DOMAIN=${APP_DOMAIN}
            APP_URL=${APP_URL}
            SES_FROM_EMAIL=${SES_FROM_EMAIL}
            IMAGE_TAG=${IMAGE_TAG}
            EOF
            sudo chmod 600 /opt/skybroe/.env
            dc() { sudo docker compose -f docker-compose.prod.yml "$@"; }
            # Docker Hub pulls fail transiently (rate limits, network) — retry.
            for i in 1 2 3; do dc pull && break; [ "$i" = 3 ] && exit 1; echo "pull failed, retrying in 15s"; sleep 15; done
            # --wait blocks until every service with a healthcheck is healthy.
            if ! dc up -d --remove-orphans --wait --wait-timeout 180; then
              echo "::error::Release ${IMAGE_TAG} failed its health checks — rolling back to ${PREV_TAG}"
              dc logs --tail 50 backend || true
              sudo sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREV_TAG}/" .env
              dc up -d --remove-orphans --wait --wait-timeout 180 || echo "::error::Rollback to ${PREV_TAG} is unhealthy too"
              exit 1
            fi
            # Keep the disk small; unused images older than 3 days are re-pullable.
            sudo docker image prune -af --filter "until=72h"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DB_USER:            ${{ secrets.DB_USER }}
          DB_PASSWORD:        ${{ secrets.DB_PASSWORD }}
          JWT_SECRET:         ${{ secrets.JWT_SECRET }}
          FAA_CLIENT_ID:      ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET:  ${{ secrets.FAA_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          APP_DOMAIN:         ${{ secrets.APP_DOMAIN }}
          AWS_REGION:         ${{ secrets.AWS_REGION || 'us-east-1' }}
          APP_URL:            https://${{ secrets.APP_DOMAIN }}
          SES_FROM_EMAIL:     ${{ secrets.SES_FROM_EMAIL || format('noreply@{0}', secrets.APP_DOMAIN) }}
          IMAGE_TAG:          ${{ steps.image.outputs.tag }}

  # ── 7. Production smoke test ──────────────────────────────────────
  smoke-prod:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy]

    steps:
      - name: API health check
        run: |
          # The backend only starts listening after Postgres is healthy and
          # initDb() completes, and Caddy must have its certificate before it
          # routes traffic — so poll until ready rather than guessing with a
          # fixed sleep. Up to 30 attempts × 10s = 5 min before giving up.
          for i in $(seq 1 30); do
            if curl -sf "https://${{ secrets.APP_DOMAIN }}/health" -o /tmp/health.json \
               && jq -e '.status == "ok"' /tmp/health.json >/dev/null 2>&1; then
              echo "API healthy after ${i} attempt(s)"
              exit 0
            fi
            echo "attempt ${i}/30: API not ready yet, retrying in 10s…"
            sleep 10
          done
          echo "::error::API health check failed after 30 attempts (5 min)"
          exit 1

      - name: Web health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://${{ secrets.APP_DOMAIN }}/" | grep -qi "<!DOCTYPE html>"; then
              echo "Web healthy after ${i} attempt(s)"
              exit 0
            fi
            echo "attempt ${i}/30: Web not ready yet, retrying in 10s…"
            sleep 10
          done
          echo "::error::Web health check failed after 30 attempts (5 min)"
          exit 1

      # Data routes require a JWT, so an unauthenticated request should get a
      # 401 from the backend — proving Caddy → backend routing and the auth gate.
      - name: Weather API smoke test
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.APP_DOMAIN }}/api/weather/metar/KORD")
          [ "$CODE" = "401" ] \
            && echo "Weather API routed and auth-protected (401)" \
            || echo "::warning::Weather API returned HTTP $CODE (expected 401 without a token)"

      - name: Airport API smoke test
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.APP_DOMAIN }}/api/airports/KORD")
          [ "$CODE" = "401" ] \
            && echo "Airports API routed and auth-protected (401)" \
            || echo "::warning::Airports API returned HTTP $CODE (expected 401 without a token)"

  # ── 8. Summary ────────────────────────────────────────────────────
  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-push, infra-apply, deploy, smoke-prod]
    if: always()

    steps:
      - name: Write summary
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "## SkyBroe Release — \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build & Push  | ${{ needs.build-push.result }}  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Infra Apply   | ${{ needs.infra-apply.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy        | ${{ needs.deploy.result }}      |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke Test    | ${{ needs.smoke-prod.result }}  |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Verify signatures" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "cosign verify \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --certificate-identity-regexp='https://github.com/${{ github.repository }}' \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \\" >> "$GITHUB_STEP_SUMMARY"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/skybroe-backend:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
