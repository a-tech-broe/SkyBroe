# Weekly version updates, opened against dev (merging dev deploys to prod via
# main, so every bump still passes the CI gate). Minor/patch bumps are grouped
# into one PR per ecosystem to keep the noise down; majors arrive individually.
# A 7-day cooldown lets brand-new releases age before we take them (most
# malicious publishes are caught and yanked within days). Security updates
# are separate, skip the cooldown, and are immediate.
version: 2

updates:
  - package-ecosystem: npm
    directories: [/app/backend, /app/web, /app/mobile]
    target-branch: dev
    cooldown: { default-days: 7 }
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/app/backend, /app/web]
    target-branch: dev
    cooldown: { default-days: 7 }
    schedule: { interval: weekly, day: monday }
    groups:
      base-images:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /infra
    target-branch: dev
    cooldown: { default-days: 7 }
    schedule: { interval: weekly, day: monday }
    groups:
      compose-images:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    cooldown: { default-days: 7 }
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: terraform
    directory: /infra/terraform
    target-branch: dev
    cooldown: { default-days: 7 }
    schedule: { interval: monthly }
