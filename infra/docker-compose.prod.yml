# Production compose — runs pre-built DockerHub images (no source build).
# This file and the Caddyfile beside it are what run on EC2: the deploy job in
# .github/workflows/cd.yml copies both to /opt/skybroe and writes .env.
# Requires .env with: DB_USER, DB_PASSWORD, JWT_SECRET, FAA_CLIENT_ID,
#                     FAA_CLIENT_SECRET, ANTHROPIC_API_KEY, DOCKERHUB_USERNAME,
#                     IMAGE_TAG, AWS_REGION, APP_DOMAIN, APP_URL, SES_FROM_EMAIL
#
# Only Caddy publishes host ports (80/443); backend and web are reachable
# solely on the compose network.

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - web
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skybroe
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKERHUB_USERNAME}/skybroe-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/skybroe
      FAA_CLIENT_ID: ${FAA_CLIENT_ID}
      FAA_CLIENT_SECRET: ${FAA_CLIENT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      APP_URL: ${APP_URL}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /skybroe/app
        awslogs-stream: backend
        awslogs-create-group: "true"

  web:
    image: ${DOCKERHUB_USERNAME}/skybroe-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /skybroe/app
        awslogs-stream: web
        awslogs-create-group: "true"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
